name: Build Android APK

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper jar
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin

      - name: Configure local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK for release
        id: prepare-apk
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" ScreenTranslator-Vi-Debug.apk
            echo "apk_path=ScreenTranslator-Vi-Debug.apk" >> $GITHUB_OUTPUT
            echo "Found APK at $APK_FILE"
          else
            echo "Error: APK not found!"
            exit 1
          fi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Vi-Debug
          path: ${{ steps.prepare-apk.outputs.apk_path }}
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ github.ref_name == 'main' && 'latest-build' || github.ref_name }}
          name: "Bản dựng tự động - ${{ github.ref_name }}"
          body: |
            ### 🎉 Bản dựng APK Việt hóa tự động (Screen Translator)
            - **Commit**: `${{ github.sha }}`
            - **Ngôn ngữ bổ sung**: Tiếng Việt (Vietnamese)
            - Tải trực tiếp file APK bên dưới để cài đặt.
          draft: false
          prerelease: false
          files: ${{ steps.prepare-apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
